<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Giovani Jimenez</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <style>
        body{
            min-height: 100vh;
            margin: 0;
            background-image: url('./image2.png');
            background-size: cover;
            background-position: center;
            color: white;
            font-family: monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        main{
            max-width: 512px;
            padding: 16px;
            margin: 16px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        img{
            display: block;
            border-radius: 50%;
        }

        h1,h2,p{
            margin: 0;
            text-align: center;
        }
        h2{
            font-size: 14px;
        }

        ul{
            padding: 0;
            margin: 0;
            display: flex;
            gap: 16px;
        }
        a{
            color: white;
            font-size: 24px;
        }

</head>
<body>
    <main>
        <img src="./image1.jpg" alt="Giovani Jimenez" width="269" height="356">
        <h1>Giovani Jimenez</h1>
        <h2>Desarrollador | Ingeniero | Frontend | Backend</h2>
        <p>
            Ingeniero en Tecnologías de la Información. Desarrollador web de frontend con Angular.
            Desarrollador de backend con Django.  
        </p>

        <ul>
            <li>
                <a href="https://github.com/giojibo" target="_blank" rel="noopener noreferrer"><i class="bi bi-github"></i></a>
            </li>
            <li>
                <a href="https://www.facebook.com/gio.ji.bo/"><i class="bi bi-facebook"></i></a>
            </li>
        </ul>
    </main>

</html>
